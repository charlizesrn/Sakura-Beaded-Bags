<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sakura Beaded Bags</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <div id="modal" class="overlay hidden"></div>
    <div id="toast"></div>

    <template id="auth-template">
      <div class="auth">
        <div class="auth-form"></div>
        <div class="auth-art">
          <div>
            <div class="flower"><i class="bi bi-flower1"></i></div>
            <h1>SAKURA</h1>
            <small>BEADED BAGS</small>
          </div>
        </div>
      </div>
    </template>

    <template id="auth-login-template">
      <h1>Welcome back!</h1>
      <p>Enter your details to sign in</p>
      <label
        >Email Address<input id="e" type="email" placeholder="Enter your email"
      /></label>
      <label
        >Password
        <div class="pw">
          <input id="p" type="password" placeholder="Enter your password" />
          <button
            type="button"
            class="eye"
            aria-label="Show password"
            onclick="togglePassword(this)"
          >
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </label>
      <div class="between">
        <label><input type="checkbox" style="width: auto" /> Remember me</label>
        <button class="link" onclick="setAuth('forgot')">
          Forgot password?
        </button>
      </div>
      <button class="btn" onclick="login()">Login</button>
      <div class="sep">OR</div>
      <button
        class="btn"
        onclick="toast('Google sign-in needs OAuth credentials (see README)')"
      >
        <i class="bi bi-google"></i> Sign in with Google
      </button>
      <p class="center">
        Don't have an account?
        <button class="link" onclick="setAuth('signup')">Sign Up</button>
      </p>
    </template>

    <template id="auth-signup-template">
      <h1>Get Started Now</h1>
      <p>Create an account</p>
      <label>Name<input id="n" placeholder="Enter your name" /></label>
      <label
        >Email Address<input id="e" type="email" placeholder="Enter your email"
      /></label>
      <label
        >Password
        <div class="pw">
          <input id="p" type="password" placeholder="Enter your password" />
          <button
            type="button"
            class="eye"
            aria-label="Show password"
            onclick="togglePassword(this)"
          >
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </label>
      <small
        >Password should be at least 15 characters OR at least 8 characters
        including a number and a lowercase letter.</small
      >
      <button class="btn" onclick="signup()">Sign Up</button>
      <div class="sep">OR</div>
      <button
        class="btn"
        onclick="toast('Google sign-in needs OAuth credentials (see README)')"
      >
        <i class="bi bi-google"></i> Sign in with Google
      </button>
      <p class="center">
        Have an account?
        <button class="link" onclick="setAuth('login')">Sign In</button>
      </p>
    </template>

    <template id="auth-forgot-template">
      <h1>Forgot password?</h1>
      <p>We will send a 6-digit code to your email.</p>
      <label
        >Email Address<input id="e" type="email" placeholder="Enter your email"
      /></label>
      <button class="btn" onclick="forgot()">Send Code</button>
      <p class="center">
        <button class="link" onclick="setAuth('login')">Back to Login</button>
      </p>
    </template>

    <template id="auth-verify-template">
      <div class="center">
        <div class="auth-icon"><i class="bi bi-envelope-lock"></i></div>
        <h1 style="font-size: 26px">Check your email</h1>
        <p>
          Enter the code sent to<br /><b id="auth-email"></b>
          <button class="link" onclick="setAuth('forgot')">(Edit)</button>
        </p>
        <div class="otp-row">
          <input
            class="otp"
            inputmode="numeric"
            maxlength="1"
            oninput="otpInput(this)"
          />
          <input
            class="otp"
            inputmode="numeric"
            maxlength="1"
            oninput="otpInput(this)"
          />
          <input
            class="otp"
            inputmode="numeric"
            maxlength="1"
            oninput="otpInput(this)"
          />
          <input
            class="otp"
            inputmode="numeric"
            maxlength="1"
            oninput="otpInput(this)"
          />
          <input
            class="otp"
            inputmode="numeric"
            maxlength="1"
            oninput="otpInput(this)"
          />
          <input
            class="otp"
            inputmode="numeric"
            maxlength="1"
            oninput="otpInput(this)"
          />
        </div>
        <button class="btn" onclick="verify()">Verify Code</button>
        <p>
          Didn't get the email?
          <button class="link" onclick="forgot(authEmail)">Resend Code</button
          ><br />Check your spam folder
        </p>
      </div>
    </template>

    <template id="auth-reset-template">
      <div class="center">
        <div class="auth-icon"><i class="bi bi-key"></i></div>
        <h1 style="font-size: 26px">Set New Password</h1>
        <p>Your new password must be different from your previous password.</p>
      </div>
      <label
        >Password
        <div class="pw">
          <input
            id="p"
            type="password"
            placeholder="Enter your password"
          /><button
            type="button"
            class="eye"
            aria-label="Show password"
            onclick="togglePassword(this)"
          >
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </label>
      <small
        >Password should be at least 15 characters OR at least 8 characters
        including a number and a lowercase letter.</small
      >
      <label
        >Confirm Password
        <div class="pw">
          <input
            id="p2"
            type="password"
            placeholder="Enter your password"
          /><button
            type="button"
            class="eye"
            aria-label="Show password"
            onclick="togglePassword(this)"
          >
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </label>
      <button class="btn" onclick="reset()">Reset Password</button>
    </template>

    <template id="auth-done-template">
      <div class="center">
        <div class="auth-icon success"><i class="bi bi-key-fill"></i></div>
        <h1 style="font-size: 26px">Password Reset Successful</h1>
        <p>
          Your password has been updated. You can now log in with your new
          password.
        </p>
        <button class="btn" onclick="setAuth('login')">Back to Login</button>
      </div>
    </template>

    <template id="shell-template">
      <header>
        <div class="logo"><i class="bi bi-flower1"></i> SAKURA</div>
        <div class="search">
          <input
            placeholder="Search this page"
            oninput="filterRows(this.value)"
          />
        </div>
        <div class="icons">
          <span class="bell" title="Low-stock alerts" onclick="nav('inventory')"
            ><i class="bi bi-bell"></i><b class="bell-count hidden">0</b></span
          >
          <span class="user-label"
            ><i class="bi bi-person-circle"></i> <span class="user-name"></span
          ></span>
          <button class="btn sm" onclick="logout()">Logout</button>
        </div>
      </header>
      <div class="layout">
        <nav id="main-nav"></nav>
        <main id="main">Loading...</main>
      </div>
    </template>

    <template id="product-page-template">
      <div class="head">
        <h1>Product Costing &amp; Pricing</h1>
        <button class="btn" onclick="newProduct()">
          <i class="bi bi-plus-circle"></i> Add Product
        </button>
      </div>
      <div id="product-empty" class="panel empty"></div>
      <div id="inventory-empty" class="panel alert"></div>
      <div class="two-col">
        <div class="panel">
          <h3>Bills of Materials (BOM)</h3>
          <div class="row">
            <label
              >Product Name<input id="pn" placeholder="e.g. Heart Bag"
            /></label>
            <label>Category<input id="pc" placeholder="e.g. Handbag" /></label>
          </div>
          <label
            >Product Image<input type="file" id="pi" accept="image/*"
          /></label>
          <div class="row">
            <label
              >Material
              <select id="bm"></select>
            </label>
            <label
              >Qty Used<input id="bq" type="number" min="0" step="any"
            /></label>
            <label
              >Unit Cost (₱)<input id="bu" type="number" min="0" step="any"
            /></label>
            <button class="btn" aria-label="Add material" onclick="addBom()">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
          <table>
            <thead>
              <tr>
                <th>Material</th>
                <th>Qty Used</th>
                <th>Unit Cost</th>
                <th>Subtotal</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="bomt"></tbody>
          </table>
          <hr />
          <div class="row">
            <label
              >Labor Expense (₱)<input
                id="pl"
                type="number"
                min="0"
                step="any"
                value="0"
                oninput="recalc()"
            /></label>
            <label
              >Packaging (optional)<input
                id="pk"
                type="number"
                min="0"
                step="any"
                value="0"
                oninput="recalc()"
            /></label>
            <label
              >Miscellaneous (optional)<input
                id="pm"
                type="number"
                min="0"
                step="any"
                value="0"
                oninput="recalc()"
            /></label>
          </div>
        </div>
        <div class="panel">
          <h3>Pricing Method Strategy</h3>
          <label
            >Method
            <select id="mt" onchange="recalc()">
              <option value="markup">Markup-Based Pricing</option>
              <option value="target">Target Selling Price</option>
            </select>
          </label>
          <label id="mkl"
            >Markup Percentage (%)<input
              id="mk"
              type="number"
              min="0"
              step="any"
              value="20"
              oninput="recalc()"
          /></label>
          <label id="tgl" class="hidden"
            >Target Selling Price (₱)<input
              id="tg"
              type="number"
              min="0"
              step="any"
              value="0"
              oninput="recalc()"
          /></label>
          <hr />
          <dl id="sum"></dl>
          <br />
          <button class="btn" onclick="saveProduct()">
            <i class="bi bi-save"></i> Save
          </button>
          <button class="btn ghost" onclick="newProduct()">Clear</button>
        </div>
      </div>
      <h2>Active Product Catalog</h2>
      <div class="noprint" id="selbar"></div>
      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>
                <input
                  type="checkbox"
                  style="width: auto"
                  onchange="selAll(this.checked)"
                />
              </th>
              <th>Image</th>
              <th>Product Name</th>
              <th>Category</th>
              <th>Material Cost</th>
              <th>Total Unit Cost</th>
              <th>Selling Price</th>
              <th>Profit</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="product-catalog"></tbody>
        </table>
      </div>
    </template>

    <template id="inventory-page-template">
      <div class="head">
        <h1>Inventory Management</h1>
        <button class="btn" onclick="addMaterial()">
          <i class="bi bi-plus-circle"></i> Add Material
        </button>
      </div>
      <div class="panel">
        <div id="inventory-empty" class="empty hidden">
          Your inventory is empty. Click 'Add Material' to add your first stock
          item.
        </div>
        <table id="inventory-table">
          <thead>
            <tr>
              <th>Material</th>
              <th>Unit</th>
              <th>Total Stock In</th>
              <th>Used</th>
              <th>Remaining</th>
              <th>Threshold</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventory-rows"></tbody>
        </table>
      </div>
      <h2>Inventory &amp; Activity Audit Log</h2>
      <div class="panel">
        <div id="inventory-log-empty" class="empty hidden">
          No audit logs found. Recent inventory changes will automatically
          display here.
        </div>
        <table id="inventory-log-table">
          <thead>
            <tr>
              <th>Time Stamp</th>
              <th>Material</th>
              <th>Action</th>
              <th>Net Change</th>
              <th>Previous Qty.</th>
              <th>Resulting Qty.</th>
              <th>Reason</th>
            </tr>
          </thead>
          <tbody id="inventory-log-rows"></tbody>
        </table>
      </div>
    </template>

    <template id="payments-page-template">
      <h1>Payment &amp; Sales</h1>
      <div id="payments-empty" class="panel empty hidden">
        No payment records available.<br />
        Create an order to begin tracking payments.<br /><br />
        <button class="btn" onclick="nav('orders')">
          <i class="bi bi-plus-circle"></i> Create Order
        </button>
      </div>
      <br id="payments-spacer" class="hidden" />
      <div id="payments-table-panel" class="panel">
        <table>
          <thead>
            <tr>
              <th>Payment ID</th>
              <th>Order ID</th>
              <th>Customer Name</th>
              <th>Total</th>
              <th>Paid</th>
              <th>Remaining Balance</th>
              <th>Date</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="payments-rows"></tbody>
        </table>
      </div>
    </template>

    <template id="orders-page-template">
      <div class="head">
        <h1>Order Management</h1>
        <button class="btn" onclick="createOrder()">
          <i class="bi bi-plus-circle"></i> Create Order
        </button>
      </div>
      <div id="orders-empty" class="panel empty hidden">
        There are no customer orders yet. Create an order to start managing your
        orders.
      </div>
      <section id="orders-content">
        <h2>Current Orders <small>(first-in, first-out)</small></h2>
        <div id="current-orders" class="cards3"></div>
        <h2>
          All Orders
          <label class="archive-toggle">
            <input
              id="archive-toggle"
              type="checkbox"
              style="width: auto"
              onchange="
                O.arch = this.checked;
                renderView();
              "
            />
            include archive (cancelled &amp; completed)</label
          >
        </h2>
        <div class="panel">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Production</th>
                <th>Delivery</th>
                <th>Payment</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="orders-rows"></tbody>
          </table>
        </div>
      </section>
    </template>

    <template id="reports-page-template">
      <div class="head">
        <div>
          <h1>Financial Reports</h1>
          <span class="muted">A clear view of your business performance.</span>
        </div>
        <div class="noprint">
          <button class="btn" onclick="exportCsv()">
            <i class="bi bi-download"></i> Export CSV
          </button>
          <button class="btn" onclick="window.print()">
            <i class="bi bi-printer"></i> Export PDF
          </button>
        </div>
      </div>
      <div class="panel noprint">
        <div class="row">
          <label>From<input type="date" id="rf" /></label>
          <label>To<input type="date" id="rt" /></label>
          <label
            >Group by<select id="rg">
              <option value="month">Month</option>
              <option value="day">Day</option>
            </select></label
          >
          <button class="btn" onclick="applyReport()">Apply</button>
        </div>
      </div>
      <div class="cards">
        <div class="card">
          <small>Total Sales</small><b id="report-sales"></b>
        </div>
        <div class="card">
          <small>Material Expense</small><b id="report-material"></b
          ><small id="report-material-pct"></small>
        </div>
        <div class="card">
          <small>Labor Expense</small><b id="report-labor"></b
          ><small id="report-labor-pct"></small>
        </div>
        <div class="card">
          <small>Gross Profit</small><b id="report-profit"></b
          ><small id="report-margin"></small>
        </div>
      </div>
      <div class="rep3">
        <div class="panel">
          <h3>Sales Analysis</h3>
          <div id="report-sales-chart"></div>
        </div>
        <div class="panel">
          <h3>Profit Chart</h3>
          <div id="report-profit-chart"></div>
        </div>
        <div class="panel">
          <h3>Material &amp; Labor Expense</h3>
          <div id="report-expense-chart"></div>
        </div>
        <div class="panel">
          <h3>Product Insight - by sales</h3>
          <div id="report-top-sales"></div>
          <h3 style="margin-top: 14px">Most profitable</h3>
          <div id="report-top-profit"></div>
        </div>
        <div class="panel">
          <h3>Customer Insight</h3>
          <div id="report-customer-donut" class="donut">
            <div>
              <b id="report-customer-total" style="font-size: 24px"></b
              ><small>customers</small>
            </div>
          </div>
          <p id="report-customer-counts" class="center"></p>
          <div id="report-top-customers"></div>
        </div>
        <div class="panel">
          <h3>Payment Breakdown</h3>
          <dl>
            <dt>Pending</dt>
            <dd id="report-pending"></dd>
            <dt>Downpayment</dt>
            <dd id="report-downpayment"></dd>
            <dt>Fully Paid</dt>
            <dd id="report-paid"></dd>
          </dl>
          <h3 style="margin-top: 14px">Cash-Flow Tracking</h3>
          <dl>
            <dt>Cash In</dt>
            <dd id="report-cash-in"></dd>
            <dt>Refunds</dt>
            <dd id="report-refunds"></dd>
            <dt>Net Cash</dt>
            <dd id="report-net-cash"></dd>
            <dt>Outstanding Balances</dt>
            <dd id="report-outstanding"></dd>
          </dl>
        </div>
      </div>
      <p class="muted">
        Sales less material and labor expenses equals gross profit. Expenses are
        snapshotted per order, so history is unaffected by later pricing
        changes.
      </p>
    </template>

    <template id="settings-page-template">
      <h1>Settings</h1>
      <br />
      <div class="two">
        <div class="panel">
          <h3>Downpayment</h3>
          <label
            >Default Downpayment % (suggested when logging a downpayment)<input
              id="dp"
              type="number"
              min="1"
              max="100"
          /></label>
          <button class="btn" onclick="saveSettings()">Save</button>
        </div>
        <div class="panel">
          <h3>Payment Methods</h3>
          <div id="payment-methods"></div>
          <div class="row">
            <input id="nm" placeholder="New method e.g. Bank Transfer" />
            <button class="btn" onclick="addMethod()">Add</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <h3>Data</h3>
        <p class="muted">
          All data is saved in this browser only (localStorage). Clearing
          browser data or switching browsers loses it.
        </p>
        <button class="btn danger" onclick="resetData()">Erase all data</button>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
